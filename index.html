<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="モダンなSVGスライドエディタ - プレゼンテーションを簡単に作成" />
    <title>SVG Slide Editor - モダンなプレゼンテーションツール</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="left">
        <h1>SVG Slide Editor</h1>
        <section class="panel slide-controls">
          <h2>スライド操作</h2>
          <div class="toolbar-group">
            <button id="new-slide">新規スライド</button>
            <button id="duplicate-slide">複製</button>
            <button id="delete-slide">削除</button>
          </div>
          <ul id="slide-list"></ul>
        </section>

        <section class="panel object-controls">
          <h2>オブジェクト追加</h2>
          <div class="toolbar-group">
            <button id="add-text">テキスト</button>
            <button id="add-rect">四角</button>
            <button id="add-circle">丸</button>
            <button id="add-image">画像</button>
          </div>
        </section>

        <section class="properties">
          <h2>プロパティ</h2>
          <label>
            選択中要素
            <input id="selected-label" type="text" value="" readonly />
          </label>
          <label>
            <span id="prop-fill-label">塗りつぶし</span>
            <input id="prop-fill" type="color" disabled />
          </label>
          <label>
            <span id="prop-stroke-label">枠色</span>
            <input id="prop-stroke" type="color" disabled />
          </label>
          <label id="prop-font-size-row">
            フォントサイズ
            <input id="prop-font-size" type="number" min="12" max="120" value="32" disabled />
          </label>
          <label id="prop-text-align-row">
            <span>文字揃え</span>
            <select id="prop-text-align" disabled>
              <option value="start">左</option>
              <option value="middle">中央</option>
              <option value="end">右</option>
            </select>
          </label>
          <label id="prop-font-family-row">
            <span>フォント</span>
            <select id="prop-font-family" disabled>
              <option value="Arial, sans-serif">Arial</option>
              <option value="Yu Gothic, sans-serif">Yu Gothic</option>
              <option value="Hiragino Kaku Gothic ProN, sans-serif">Hiragino Kaku Gothic ProN</option>
              <option value="Meiryo, sans-serif">メイリオ</option>
              <option value="Times New Roman, serif">Times</option>
              <option value="Courier New, monospace">Courier New</option>
            </select>
          </label>
          <label id="prop-font-bold-row" class="checkbox-row">
            <input id="prop-font-bold" type="checkbox" disabled />
            <span>太字</span>
          </label>
          <label id="prop-font-italic-row" class="checkbox-row">
            <input id="prop-font-italic" type="checkbox" disabled />
            <span>斜体</span>
          </label>
          <label id="prop-text-row">
            テキスト
            <input id="prop-text" type="text" disabled placeholder="テキストを選択してください" />
          </label>
        </section>

        <section class="panel object-actions">
          <h2>オブジェクト操作</h2>
          <div class="toolbar-group small">
            <button id="bring-front" disabled>前面へ</button>
            <button id="send-back" disabled>背面へ</button>
          </div>
          <div class="toolbar-group small">
            <button id="duplicate-element" disabled>要素複製</button>
            <button id="delete-element" disabled>要素削除</button>
          </div>
        </section>

        <section class="actions">
          <div class="actions-row actions-row-inline">
            <span class="actions-label">JSON</span>
            <button id="import-json-button" type="button" class="action-btn action-import">インポート</button>
            <button id="export-json" class="action-btn action-export">エクスポート</button>
            <input id="import-json" type="file" accept="application/json,.json" />
          </div>
          <div class="actions-row actions-row-inline">
            <span class="actions-label">SVG</span>
            <button id="import-svg-button" type="button" class="action-btn action-import">インポート</button>
            <button id="export-svg" class="action-btn action-export">エクスポート</button>
            <input id="import-svg" type="file" accept=".svg,image/svg+xml" />
          </div>
          <button id="reset-state">全部リセット</button>
        </section>
      </aside>

      <main class="main">
        <header class="status-bar">
          <span id="slide-title"></span>
          <span id="instructions">ドラッグして移動 • 端点で拡大縮小 • シングルクリックでテキストを直接編集</span>
        </header>

        <section class="canvas-wrap">
          <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="スライドキャンバス"></svg>
          <div class="history-controls" aria-label="履歴操作">
            <button id="undo-action" type="button" class="history-btn" disabled>戻る</button>
            <button id="redo-action" type="button" class="history-btn" disabled>進む</button>
          </div>
        </section>
      </main>
    </div>

    <script src="src/commands/elementCommands.js"></script>
    <script src="src/commands/alignSnap.js"></script>
    <script src="src/commands/history.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
